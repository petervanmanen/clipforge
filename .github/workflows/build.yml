name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0' }}
        run: |
          export VERSION="${VERSION#v}"
          ./scripts/build_app.sh
          ditto -c -k --keepParent build/FitMovie.app build/FitMovie.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: FitMovie
          path: build/FitMovie.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/FitMovie.zip --generate-notes

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Compile-only check for the simulator; installing on a device needs your own signing team (see README).
      - name: Build iPhone app
        run: >
          xcodebuild -project iOS/FitMovie.xcodeproj -target FitMovie
          -sdk iphonesimulator -configuration Release
          CODE_SIGNING_ALLOWED=NO build
